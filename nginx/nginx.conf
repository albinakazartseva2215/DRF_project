events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;
        location /static/ {
            alias /app/staticfiles/;

        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }

        location / {
            try_files $uri @proxy_to_django;
        }

        location @proxy_to_django {
            proxy_pass http://django;
        }
    }
}